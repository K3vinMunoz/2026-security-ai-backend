services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: security-ai-backend:latest
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped
    environment:
      DEBUG: "false"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: security_ai
      POSTGRES_USER: security_ai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-security_ai_dev_password}
    env_file:
      - path: .env
        required: false
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: pgvector/pgvector:0.8.7-pg17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: security_ai
      POSTGRES_USER: security_ai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-security_ai_dev_password}
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U security_ai -d security_ai"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres_data: